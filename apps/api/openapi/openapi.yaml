openapi: 3.0.3
info:
  title: Music Academy API
  version: 0.2.0
  description: |
    API de gestión de academias musicales. Contrato único para web y móvil.

    Los endpoints del núcleo de la fase 1 (agenda, reagendamiento, asistencia, avisos)
    están definidos aquí antes de implementarse: la web se construye contra este
    contrato con una API simulada, y el backend lo cumple después.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: system
  - name: auth
  - name: me
  - name: catalog
  - name: sessions
  - name: students
  - name: teachers
  - name: reschedule
  - name: attendance
  - name: notifications

paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      summary: El proceso está vivo
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReady
      security: []
      summary: El proceso puede atender tráfico (la base de datos responde)
      tags: [system]
      responses:
        "200":
          description: Listo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: No está listo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      operationId: login
      summary: Iniciar sesión con correo y contraseña
      description: |
        Si las credenciales son correctas, el servidor abre la sesión con una cookie
        `session` (HttpOnly, SameSite=Lax) y devuelve el perfil. El cliente no maneja tokens.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión abierta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Viewer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Correo o contraseña incorrectos (no se indica cuál de los dos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
  /auth/logout:
    post:
      operationId: logout
      summary: Cerrar la sesión actual
      tags: [auth]
      responses:
        "204":
          description: Sesión cerrada (también si ya estaba cerrada)

  /me:
    get:
      operationId: getMe
      summary: Persona autenticada, sus roles y los alumnos a su cargo
      tags: [me]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Viewer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rooms:
    get:
      operationId: listRooms
      summary: Salas de la academia
      tags: [catalog]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
  /teachers:
    get:
      operationId: listTeachers
      summary: Todos los profesores de la academia con sus alumnos y horas del período (solo dirección)
      description: |
        Incluye a los profesores sin grupo propio que hayan dictado reemplazos.
        Cualquier otro rol recibe 403. Sin `from` y `to`, el período es el mes actual.
      tags: [teachers]
      parameters:
        - $ref: "#/components/parameters/OptionalFrom"
        - $ref: "#/components/parameters/OptionalTo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /teachers/{teacherId}:
    get:
      operationId: getTeacher
      summary: Un profesor con sus grupos, alumnos, horas y reemplazos del período (solo dirección)
      tags: [teachers]
      parameters:
        - name: teacherId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OptionalFrom"
        - $ref: "#/components/parameters/OptionalTo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /class-groups:
    get:
      operationId: listClassGroups
      summary: Grupos de clase visibles para quien consulta
      tags: [catalog]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassGroup"

  /students:
    get:
      operationId: listStudents
      summary: Alumnos visibles para quien consulta, con sus profesores y horas del período
      description: |
        Dirección ve a todos. Un profesor ve solo a los alumnos de sus grupos, y de cada uno
        únicamente su relación con él (nunca las clases ni las horas con otros profesores).
        Un apoderado, o un alumno adulto, ve a los alumnos a su cargo con todos sus profesores.
        Sin `from` y `to`, el período es el mes actual.
      tags: [students]
      parameters:
        - $ref: "#/components/parameters/OptionalFrom"
        - $ref: "#/components/parameters/OptionalTo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
  /students/{studentId}:
    get:
      operationId: getStudent
      summary: Un alumno con sus profesores, clases y horas del período
      description: Mismas reglas de visibilidad que la lista.
      tags: [students]
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OptionalFrom"
        - $ref: "#/components/parameters/OptionalTo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions:
    get:
      operationId: listSessions
      summary: Sesiones visibles para quien consulta, dentro de un rango
      description: |
        Dirección ve todas. Un profesor ve las suyas. Un apoderado ve las de sus pupilos.
        Los filtros `teacherId` y `roomId` acotan lo que cada rol ya puede ver; nunca amplían
        la visibilidad. Se pueden combinar.
      tags: [sessions]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: teacherId
          in: query
          required: false
          description: Solo las clases que dicta este profesor (reemplazos incluidos).
          schema: { type: string, format: uuid }
        - name: roomId
          in: query
          required: false
          description: Solo las clases que se hacen en esta sala.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
  /sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Detalle de una sesión
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{sessionId}/cancel:
    post:
      operationId: cancelSession
      summary: Cancelar una sesión (profesor o dirección) y avisar a las familias
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelInput"
      responses:
        "200":
          description: Sesión cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sessions/{sessionId}/reschedule-options:
    get:
      operationId: listRescheduleOptions
      summary: Horarios libres en que se puede mover la sesión
      description: Solo ofrece horarios sin choque de sala ni de profesor que respetan las reglas de la academia.
      tags: [reschedule]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RescheduleOption"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{sessionId}/reschedule-requests:
    post:
      operationId: createRescheduleRequest
      summary: Proponer un nuevo horario para una sesión
      tags: [reschedule]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleRequestInput"
      responses:
        "201":
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PolicyViolation"
  /reschedule-requests:
    get:
      operationId: listRescheduleRequests
      summary: Solicitudes de reagendamiento visibles para quien consulta
      tags: [reschedule]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RescheduleStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RescheduleRequest"
  /reschedule-requests/{requestId}/decision:
    post:
      operationId: decideRescheduleRequest
      summary: Aprobar o rechazar una solicitud
      tags: [reschedule]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Solicitud resuelta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sessions/{sessionId}/attendance:
    get:
      operationId: getAttendance
      summary: Asistencia de una sesión, con un registro por alumno inscrito
      tags: [attendance]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveAttendance
      summary: Guardar la asistencia de una sesión
      tags: [attendance]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "200":
          description: Asistencia guardada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            La asistencia no se puede marcar ahora: la clase aún no empieza, está cancelada
            o pasaron más de 7 días desde que terminó.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /notifications:
    get:
      operationId: listNotifications
      summary: Avisos dentro de la app
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Marcar un aviso como leído
      tags: [notifications]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Marcado
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        Sesión abierta con `POST /auth/login`. Todos los endpoints la exigen salvo los
        de salud y el inicio de sesión; sin ella responden 401 con el código `unauthenticated`.

  parameters:
    OptionalFrom:
      name: from
      in: query
      required: false
      description: Inicio del período (incluido). Por defecto, el comienzo del mes actual.
      schema: { type: string, format: date-time }
    OptionalTo:
      name: to
      in: query
      required: false
      description: Fin del período (excluido). Por defecto, el comienzo del mes siguiente.
      schema: { type: string, format: date-time }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: No hay sesión abierta o expiró
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: No tiene permiso para esta acción
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No existe o no es visible para quien consulta
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Choque de sala o de profesor, o el estado ya cambió
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    PolicyViolation:
      description: Incumple una regla de la academia (anticipación mínima, tope mensual)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable para que el cliente decida qué mostrar
          example: room_conflict
        message:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    Role:
      type: string
      enum: [director, teacher, guardian, student]

    StudentRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }

    Viewer:
      type: object
      required: [id, fullName, roles, activeRole, students]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        activeRole: { $ref: "#/components/schemas/Role" }
        students:
          type: array
          description: Alumnos a cargo (apoderado) o la propia persona (alumno adulto)
          items: { $ref: "#/components/schemas/StudentRef" }

    Room:
      type: object
      required: [id, name, capacity]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        capacity: { type: integer, minimum: 1 }

    TeacherOverview:
      type: object
      required: [id, fullName, instruments, studentCount, groupCount, hours]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        instruments:
          type: array
          items: { type: string }
        studentCount:
          type: integer
          minimum: 0
          description: Alumnos distintos inscritos en sus grupos
        groupCount:
          type: integer
          minimum: 0
        hours:
          $ref: "#/components/schemas/PeriodHours"
          description: |
            Horas que dictó o dictará en el período (por `teacher_id` de la sesión):
            incluye reemplazos que cubrió y excluye las clases suyas que cubrió otra persona.
        nextSessionAt:
          type: string
          format: date-time
          nullable: true
          description: Próxima clase programada que dicta este profesor

    SubstitutionSummary:
      type: object
      required: [coveredMinutes, replacedMinutes]
      properties:
        coveredMinutes:
          type: integer
          minimum: 0
          description: Minutos de clases de otros profesores que este cubrió
        replacedMinutes:
          type: integer
          minimum: 0
          description: Minutos de clases suyas que cubrieron otros profesores

    TeacherGroup:
      type: object
      required: [group, capacity, students, hours]
      properties:
        group: { $ref: "#/components/schemas/GroupBrief" }
        capacity: { type: integer, minimum: 1 }
        students:
          type: array
          items: { $ref: "#/components/schemas/StudentRef" }
        hours:
          $ref: "#/components/schemas/PeriodHours"
          description: Horas del grupo en el período, las dicte quien las dicte

    TeacherDetail:
      type: object
      required: [teacher, groups, substitutions]
      properties:
        teacher: { $ref: "#/components/schemas/TeacherOverview" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/TeacherGroup" }
        substitutions: { $ref: "#/components/schemas/SubstitutionSummary" }

    GroupKind:
      type: string
      enum: [individual, group]

    ClassGroup:
      type: object
      required: [id, name, instrument, level, kind, teacherId, weekday, startTime, durationMinutes, capacity, enrolled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        instrument: { type: string }
        level: { type: string }
        kind: { $ref: "#/components/schemas/GroupKind" }
        teacherId: { type: string, format: uuid }
        roomId: { type: string, format: uuid, nullable: true }
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo
        startTime:
          type: string
          example: "16:00"
        durationMinutes: { type: integer, minimum: 1 }
        capacity: { type: integer, minimum: 1 }
        enrolled: { type: integer, minimum: 0 }

    TeacherRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }

    GroupBrief:
      type: object
      required: [id, name, instrument, level, kind, weekday, startTime, durationMinutes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        instrument: { type: string }
        level: { type: string }
        kind: { $ref: "#/components/schemas/GroupKind" }
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo
        startTime:
          type: string
          example: "16:00"
        durationMinutes: { type: integer, minimum: 1 }
        roomName: { type: string, nullable: true }

    PeriodHours:
      type: object
      description: |
        Minutos de clase del período. Las canceladas no cuentan como realizadas.
        Una clase con reemplazo cuenta en la relación con el profesor titular del grupo.
      required: [scheduledMinutes, completedMinutes, cancelledMinutes]
      properties:
        scheduledMinutes:
          type: integer
          minimum: 0
          description: Clases del período que aún no se realizan
        completedMinutes:
          type: integer
          minimum: 0
          description: Clases del período que ya ocurrieron
        cancelledMinutes:
          type: integer
          minimum: 0

    AttendanceSummary:
      type: object
      description: |
        Asistencia de un alumno en el período, solo de clases que ya empezaron y no se cancelaron.
        Un alumno sin marcar cuenta en `unmarked`; no se asume presente ni ausente.
      required: [attendedMinutes, present, late, absent, excused, unmarked]
      properties:
        attendedMinutes:
          type: integer
          minimum: 0
          description: Minutos de las clases en que estuvo presente o atrasado
        present: { type: integer, minimum: 0 }
        late: { type: integer, minimum: 0 }
        absent: { type: integer, minimum: 0 }
        excused: { type: integer, minimum: 0 }
        unmarked: { type: integer, minimum: 0 }

    StudentTeacherLink:
      type: object
      description: La relación de un alumno con un profesor.
      required: [teacher, groups, hours, attendance]
      properties:
        teacher: { $ref: "#/components/schemas/TeacherRef" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/GroupBrief" }
        hours: { $ref: "#/components/schemas/PeriodHours" }
        attendance: { $ref: "#/components/schemas/AttendanceSummary" }
        nextSessionAt:
          type: string
          format: date-time
          nullable: true
          description: Próxima clase programada con este profesor (en cualquier fecha futura)

    StudentOverview:
      type: object
      required: [id, fullName, age, links]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        age: { type: integer, minimum: 0 }
        links:
          type: array
          description: Un elemento por profesor visible para quien consulta
          items: { $ref: "#/components/schemas/StudentTeacherLink" }

    SessionStatus:
      type: string
      enum: [scheduled, completed, cancelled]

    Session:
      type: object
      required: [id, classGroupId, groupName, instrument, teacherId, teacherName, startsAt, endsAt, status, students, canReschedule, canTakeAttendance, attendancePending]
      properties:
        id: { type: string, format: uuid }
        classGroupId: { type: string, format: uuid }
        groupName: { type: string }
        instrument: { type: string }
        teacherId: { type: string, format: uuid }
        teacherName: { type: string }
        originalTeacherId:
          type: string
          format: uuid
          nullable: true
          description: Profesor titular cuando la sesión tiene reemplazo
        originalTeacherName: { type: string, nullable: true }
        roomId: { type: string, format: uuid, nullable: true }
        roomName: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/SessionStatus" }
        cancelReason: { type: string, nullable: true }
        students:
          type: array
          description: Alumnos inscritos. Un apoderado solo ve a sus pupilos.
          items: { $ref: "#/components/schemas/StudentRef" }
        pendingRescheduleRequestId:
          type: string
          format: uuid
          nullable: true
        canReschedule:
          type: boolean
          description: |
            Quien consulta puede proponer o aplicar un cambio de horario ahora.
            Las reglas viven en el servidor; el cliente solo las muestra.
        rescheduleBlockedReason:
          type: string
          nullable: true
          description: |
            Si quien consulta tendría permiso pero una regla de la academia lo impide
            (anticipación mínima, tope mensual), explica por qué. null en cualquier otro caso.
        canTakeAttendance:
          type: boolean
          description: |
            Quien consulta puede marcar asistencia ahora: dicta la clase (o es dirección), la clase
            ya empezó, no está cancelada y no pasaron más de 7 días desde que terminó.
        attendancePending:
          type: boolean
          description: |
            Solo es true para quien puede marcar asistencia: la clase ya empezó y hay
            alumnos sin marcar.

    CancelInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }

    RescheduleStatus:
      type: string
      enum: [pending, approved, rejected, cancelled, expired]

    RescheduleOption:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        roomId: { type: string, format: uuid, nullable: true }
        roomName: { type: string, nullable: true }

    RescheduleRequestInput:
      type: object
      required: [proposedStartsAt, proposedEndsAt]
      properties:
        proposedStartsAt: { type: string, format: date-time }
        proposedEndsAt: { type: string, format: date-time }
        proposedRoomId: { type: string, format: uuid, nullable: true }
        reason: { type: string, nullable: true }

    RescheduleRequest:
      type: object
      required: [id, sessionId, groupName, requestedById, requestedByName, originalStartsAt, originalEndsAt, proposedStartsAt, proposedEndsAt, status, createdAt, expiresAt, viewerCanDecide]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        groupName: { type: string }
        requestedById: { type: string, format: uuid }
        requestedByName: { type: string }
        originalStartsAt: { type: string, format: date-time }
        originalEndsAt: { type: string, format: date-time }
        proposedStartsAt: { type: string, format: date-time }
        proposedEndsAt: { type: string, format: date-time }
        proposedRoomId: { type: string, format: uuid, nullable: true }
        proposedRoomName: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/RescheduleStatus" }
        decisionNote: { type: string, nullable: true }
        decidedByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        viewerCanDecide:
          type: boolean
          description: Quien consulta puede aprobar o rechazar esta solicitud ahora.

    DecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note: { type: string, nullable: true }

    AttendanceStatus:
      type: string
      enum: [present, absent, late, excused]

    AttendanceRecord:
      type: object
      required: [studentId, fullName, agreedInAdvance]
      properties:
        studentId: { type: string, format: uuid }
        fullName: { type: string }
        status:
          allOf:
            - $ref: "#/components/schemas/AttendanceStatus"
          nullable: true
          description: null mientras no se haya marcado
        note: { type: string, nullable: true }
        agreedInAdvance:
          type: boolean
          description: |
            Ausencia acordada de antemano con el profesor. Solo puede ser true cuando el
            estado es `excused`. La fase 1 solo la registra; los créditos llegan en la fase 2.

    AttendanceInput:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            type: object
            required: [studentId, status]
            properties:
              studentId: { type: string, format: uuid }
              status: { $ref: "#/components/schemas/AttendanceStatus" }
              note: { type: string, nullable: true }
              agreedInAdvance:
                type: boolean
                default: false
                description: Solo es válido con el estado `excused`; con otro estado el servidor responde 400.

    Notification:
      type: object
      required: [id, type, title, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          example: session_moved
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
