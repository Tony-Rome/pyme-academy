name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicacademy
          POSTGRES_PASSWORD: musicacademy
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musicacademy"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgres://musicacademy:musicacademy@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Código generado al día
        run: |
          go generate ./...
          git diff --exit-code -- internal/api
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./... -count=1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cliente TypeScript al día
        run: |
          npm run generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: npm run typecheck
      - run: npm run build:web
